<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="viewer.css">
  <title>Exercise guide</title>
</head>
<body>
  <main id="stage" aria-label="Animated exercise demonstration">
    <section class="media-panel">
      <button
        id="motion-toggle"
        class="guide"
        type="button"
        aria-label="Pause exercise animation"
        title="Pause exercise animation"
      >
        <img id="motion" alt="" decoding="async" draggable="false" hidden>
        <canvas id="motion-still" hidden></canvas>
        <span class="motion-state" aria-hidden="true">
          <span id="playback-play" hidden><i data-lucide="play"></i></span>
          <span id="playback-pause"><i data-lucide="pause"></i></span>
        </span>
      </button>
      <div class="media-toolbar">
        <button id="info" type="button" aria-label="Exercise instructions" title="Exercise instructions">
          <i data-lucide="info"></i>
        </button>
        <a class="attribution" href="https://ascendapi.com">
          <span>Media by AscendAPI</span>
          <i data-lucide="external-link"></i>
        </a>
      </div>
    </section>
    <div id="loading" role="status"><span></span></div>
    <div id="error" role="alert" hidden>Exercise guide unavailable</div>
    <div id="instructions" class="sheet-backdrop" hidden>
      <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="instruction-title">
        <header>
          <div>
            <p>FORM GUIDE</p>
            <h1 id="instruction-title"></h1>
          </div>
          <button id="close" type="button" aria-label="Close instructions" title="Close">
            <i data-lucide="x"></i>
          </button>
        </header>
        <div class="sheet-content">
          <article><h2>Setup</h2><p id="instruction-setup"></p></article>
          <article><h2>Movement</h2><p id="instruction-movement"></p></article>
          <div class="instruction-grid">
            <article><h2>Breathing</h2><p id="instruction-breathing"></p></article>
            <article><h2>Tempo</h2><p id="instruction-tempo"></p></article>
          </div>
          <article class="safety"><h2>Safety</h2><p id="instruction-safety"></p></article>
        </div>
      </section>
    </div>
  </main>
  <script src="viewer.js"></script>
</body>
</html>
