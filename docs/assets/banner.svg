      <stop offset="1" stop-color="#18BDF5"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.7" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#0A1C4A"/>
      <stop offset="1" stop-color="#020A22"/>
