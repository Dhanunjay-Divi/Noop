# Project-wide Gradle settings.

# Compose compilation, D8, both flavor tests, and lint can overlap in the full verification graph.
# Keep enough headroom for that production-equivalent build instead of relying on focused task order.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Run independent tasks in parallel where the module graph allows.
org.gradle.parallel=true

# Reuse outputs from previous builds.
org.gradle.caching=true

# Only configure projects relevant to the requested task.
org.gradle.configureondemand=true

# AndroidX is required (Compose, Room, lifecycle all depend on it).
android.useAndroidX=true

# Kotlin code style for the IDE.
kotlin.code.style=official

# R8 full mode for release builds. (Moot while release ships unminified — see build.gradle.kts.)
android.enableR8.fullMode=true

# Only keep the resources for the configurations actually used (smaller APK).
android.nonTransitiveRClass=true

# AGP 8.13 defaults headless managed devices to the removed `auto-no-window` renderer.
# `auto` works with both current emulator 37.x and the older emulator on Linux CI.
android.testoptions.manageddevices.emulator.gpu=auto
