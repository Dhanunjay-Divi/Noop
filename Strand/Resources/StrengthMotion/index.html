<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="viewer.css">
  <title>Exercise guide</title>
</head>
<body>
  <main id="stage" aria-label="Interactive 3D exercise demonstration">
    <canvas id="motion"></canvas>
    <div id="loading" role="status"><span></span></div>
    <div id="error" role="alert" hidden>3D guide unavailable</div>
    <div class="body-style" role="group" aria-label="Trainer body">
      <button type="button" data-body-style="man" aria-label="Male trainer" title="Male trainer">
        <i data-lucide="user-round"></i>
        <span>Man</span>
      </button>
      <button type="button" data-body-style="woman" aria-label="Female trainer" title="Female trainer">
        <i data-lucide="person-standing"></i>
        <span>Woman</span>
      </button>
    </div>
    <div class="controls">
      <button id="info" type="button" aria-label="Exercise instructions" title="Exercise instructions">
        <i data-lucide="info"></i>
      </button>
      <button id="pause" type="button" aria-label="Pause animation" title="Pause animation">
        <i data-lucide="pause"></i>
      </button>
      <button id="reset" type="button" aria-label="Reset 3D view" title="Reset 3D view">
        <i data-lucide="rotate-ccw"></i>
      </button>
    </div>
    <div id="instructions" class="sheet-backdrop" hidden>
      <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="instruction-title">
        <header>
          <div>
            <p>FORM GUIDE</p>
            <h1 id="instruction-title"></h1>
          </div>
          <button id="close" type="button" aria-label="Close instructions" title="Close">
            <i data-lucide="x"></i>
          </button>
        </header>
        <div class="sheet-content">
          <article><h2>Setup</h2><p id="instruction-setup"></p></article>
          <article><h2>Movement</h2><p id="instruction-movement"></p></article>
          <div class="instruction-grid">
            <article><h2>Breathing</h2><p id="instruction-breathing"></p></article>
            <article><h2>Tempo</h2><p id="instruction-tempo"></p></article>
          </div>
          <article class="safety"><h2>Safety</h2><p id="instruction-safety"></p></article>
        </div>
      </section>
    </div>
  </main>
  <script src="viewer.js"></script>
</body>
</html>
