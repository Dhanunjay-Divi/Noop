# Build and test verification for the macOS and iOS app targets.
#
# This job compiles both app targets on every relevant change so a shared-code
# change cannot silently break iOS or regress macOS. It builds both targets and
# runs the macOS app suite plus the iOS production-shell suite with signing
# disabled, no secrets, no signing identity, and no uploaded app artifacts.
name: App build (macOS + iOS)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: apple-applicability
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned 2026-08-11
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine whether Apple checks apply
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${BASE_SHA:-}" ] || [[ "$BASE_SHA" =~ ^0+$ ]] ||
             ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED_FILES="$RUNNER_TEMP/noop-required-ci-changed-files.txt"
          git diff --no-renames --name-only "$BASE_SHA" "$GITHUB_SHA" \
            > "$CHANGED_FILES"
          if grep -Eq '^((Strand|StrandTests|StrandiOS|NOOPiOSUITests|StrandiOSShared|StrandiOSWidgets|NOOPWatch|NOOPWatchComplications|Packages|Config)/|Strand\.xcodeproj/project\.xcworkspace/xcshareddata/swiftpm/Package\.resolved$|(LICENSE|NOTICE|ATTRIBUTION\.md|DISCLAIMER\.md|TERMS\.md)$|project\.yml$|Tools/(validate-launch-gate-isolation\.py|tests/test_launch_gate_isolation\.py)$|\.github/workflows/app-build\.yml$)' \
             "$CHANGED_FILES"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [changes]
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # #51: the macOS build must be universal — 'platform=macOS' on an Apple-Silicon runner thins to
          # arm64-only. Use the generic destination + explicit ARCHS so this CI verify catches an x86_64
          # break at PR time (matches the release/testing workflows).
          - scheme: Strand
            destination: 'generic/platform=macOS'
            extra_args: 'ARCHS="x86_64 arm64" ONLY_ACTIVE_ARCH=NO'
            runner: macos-15
          # iOS needs the iOS 26 SDK (Liquid Glass's `glassEffect`, landed 2026-07-07) which macos-15's
          # default Xcode doesn't ship — matches the runner used by the community packaging
          # workflows for their NOOPiOS legs. macos-15 stays correct for the macOS/Strand leg above.
          - scheme: NOOPiOS
            destination: 'generic/platform=iOS Simulator'
            # Xcode 26.5's universal simulator graph can incorrectly compile the embedded Watch app
            # as an iOS-simulator product and reject its valid watchOS-only AppIcon. CI runs on Apple
            # Silicon, so build the runnable arm64 simulator slice explicitly.
            extra_args: 'ARCHS=arm64 ONLY_ACTIVE_ARCH=YES'
            runner: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned 2026-08-11
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test launch-gate isolation checker
        if: matrix.scheme == 'NOOPiOS'
        run: python3 -m unittest Tools.tests.test_launch_gate_isolation

      # Clean CI checkouts intentionally have no ignored verifier file. This name-only scan still
      # proves that public policy reaches every launch surface and private verifier setting names
      # do not leak from the iPhone target into widgets or either Watch target.
      - name: Validate launch-gate build-setting isolation
        if: matrix.scheme == 'NOOPiOS'
        run: >-
          python3 Tools/validate-launch-gate-isolation.py
          --allow-missing-iphone-secrets

      - name: Build ${{ matrix.scheme }}
        run: >-
          xcodebuild -scheme '${{ matrix.scheme }}' -configuration Debug
          -destination '${{ matrix.destination }}' ${{ matrix.extra_args }}
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          build

      # Run the app-target unit tests (StrandTests, wired into the Strand scheme's test action in
      # project.yml). Uses a concrete (runnable) macOS destination, not the universal generic one.
      - name: Test ${{ matrix.scheme }}
        if: matrix.scheme == 'Strand'
        run: >-
          xcodebuild -scheme Strand -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          test

      - name: Test iOS production shell
        if: matrix.scheme == 'NOOPiOS'
        run: >-
          xcodebuild -scheme NOOPiOS -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          test

  # Repository housekeeping: on-demand app-build runs may use disposable `ci/<name>` branches
  # (a PR's content pushed somewhere the workflow can run). Once the build finishes (pass OR fail —
  # always()), delete that branch so GitHub's "Compare & pull request" banner doesn't linger after each
  # run. Guarded to ci/-prefixed BRANCH refs only — a dispatch from main or any real branch is untouched.
  cleanup:
    needs: [build]
    if: ${{ always() && github.ref_type == 'branch' && startsWith(github.ref_name, 'ci/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the disposable CI branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_REF_NAME}" || true

  apple-ci-required:
    name: apple-ci-required
    needs: [changes, build]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every applicable Apple job
        env:
          APPLICABILITY_RESULT: ${{ needs.changes.result }}
          RUN_REQUIRED: ${{ needs.changes.outputs.run }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          test "$APPLICABILITY_RESULT" = "success"
          if [ "$RUN_REQUIRED" = "true" ]; then
            test "$BUILD_RESULT" = "success"
          else
            test "$RUN_REQUIRED" = "false"
            test "$BUILD_RESULT" = "skipped"
          fi
