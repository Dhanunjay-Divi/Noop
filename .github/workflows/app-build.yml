# Build and test verification for the macOS and iOS app targets.
#
# This job compiles both app targets on every relevant change so a shared-code
# change cannot silently break iOS or regress macOS. It is a compile-only gate:
# CODE_SIGNING_ALLOWED=NO, no secrets, no signing identity, and no uploaded artifacts.
name: App build (macOS + iOS)

on:
  pull_request:
    branches: [main]
    paths:
      - 'Strand/**'
      - 'StrandiOS/**'
      - 'NOOPiOSUITests/**'
      - 'StrandiOSShared/**'
      - 'StrandiOSWidgets/**'
      - 'Packages/**'
      - 'Config/**'
      - 'Tools/validate-launch-gate-isolation.py'
      - 'Tools/tests/test_launch_gate_isolation.py'
      - 'project.yml'
      - '.github/workflows/app-build.yml'
  push:
    branches: [main]
    paths:
      - 'Strand/**'
      - 'StrandiOS/**'
      - 'NOOPiOSUITests/**'
      - 'StrandiOSShared/**'
      - 'StrandiOSWidgets/**'
      - 'Packages/**'
      - 'Config/**'
      - 'Tools/validate-launch-gate-isolation.py'
      - 'Tools/tests/test_launch_gate_isolation.py'
      - 'project.yml'
      - '.github/workflows/app-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # #51: the macOS build must be universal — 'platform=macOS' on an Apple-Silicon runner thins to
          # arm64-only. Use the generic destination + explicit ARCHS so this CI verify catches an x86_64
          # break at PR time (matches the release/testing workflows).
          - scheme: Strand
            destination: 'generic/platform=macOS'
            extra_args: 'ARCHS="x86_64 arm64" ONLY_ACTIVE_ARCH=NO'
            runner: macos-15
          # iOS needs the iOS 26 SDK (Liquid Glass's `glassEffect`, landed 2026-07-07) which macos-15's
          # default Xcode doesn't ship — matches the runner used by the community packaging
          # workflows for their NOOPiOS legs. macos-15 stays correct for the macOS/Strand leg above.
          - scheme: NOOPiOS
            destination: 'generic/platform=iOS Simulator'
            extra_args: ''
            runner: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned 2026-08-11
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test launch-gate isolation checker
        if: matrix.scheme == 'NOOPiOS'
        run: python3 -m unittest Tools.tests.test_launch_gate_isolation

      # Clean CI checkouts intentionally have no ignored verifier file. This name-only scan still
      # proves that public policy reaches every launch surface and private verifier setting names
      # do not leak from the iPhone target into widgets or either Watch target.
      - name: Validate launch-gate build-setting isolation
        if: matrix.scheme == 'NOOPiOS'
        run: >-
          python3 Tools/validate-launch-gate-isolation.py
          --allow-missing-iphone-secrets

      - name: Build ${{ matrix.scheme }}
        run: >-
          xcodebuild -scheme '${{ matrix.scheme }}' -configuration Debug
          -destination '${{ matrix.destination }}' ${{ matrix.extra_args }}
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          build

      # Run the app-target unit tests (StrandTests, wired into the Strand scheme's test action in
      # project.yml). Uses a concrete (runnable) macOS destination, not the universal generic one.
      - name: Test ${{ matrix.scheme }}
        if: matrix.scheme == 'Strand'
        run: >-
          xcodebuild -scheme Strand -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          test

      - name: Test iOS production shell
        if: matrix.scheme == 'NOOPiOS'
        run: >-
          xcodebuild -scheme NOOPiOS -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          test

  # Repository housekeeping: on-demand app-build runs may use disposable `ci/<name>` branches
  # (a PR's content pushed somewhere the workflow can run). Once the build finishes (pass OR fail —
  # always()), delete that branch so GitHub's "Compare & pull request" banner doesn't linger after each
  # run. Guarded to ci/-prefixed BRANCH refs only — a dispatch from main or any real branch is untouched.
  cleanup:
    needs: [build]
    if: ${{ always() && github.ref_type == 'branch' && startsWith(github.ref_name, 'ci/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the disposable CI branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_REF_NAME}" || true
