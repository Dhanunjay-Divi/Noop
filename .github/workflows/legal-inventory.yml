name: Runtime license inventory

on:
  pull_request:
    branches: [main]
    paths:
      - 'Package.resolved'
      - '**/Package.resolved'
      - 'android/app/gradle.lockfile'
      - 'server/requirements*.txt'
      - 'server/requirements.lock'
      - 'server/Dockerfile'
      - 'server/backup/Dockerfile'
      - 'server/compose.yaml'
      - 'ThirdPartyNotices/**'
      - 'NOTICE'
      - 'Tools/release-legal-gate.py'
      - '.github/workflows/legal-inventory.yml'
  push:
    branches: [main]
    paths:
      - 'Package.resolved'
      - '**/Package.resolved'
      - 'android/app/gradle.lockfile'
      - 'server/requirements*.txt'
      - 'server/requirements.lock'
      - 'server/Dockerfile'
      - 'server/backup/Dockerfile'
      - 'server/compose.yaml'
      - 'ThirdPartyNotices/**'
      - 'NOTICE'
      - 'Tools/release-legal-gate.py'
      - '.github/workflows/legal-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legal-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # releases-v4, pinned 2026-08-11
        with:
          persist-credentials: false
      - name: Verify exact runtime graph and bundled notices
        run: |
          python3 Tools/release-legal-gate.py check
          python3 -m unittest Tools/tests/test_release_legal_gate.py
