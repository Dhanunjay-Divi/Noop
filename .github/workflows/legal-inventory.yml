name: Runtime license inventory

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legal-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: runtime-license-applicability
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned 2026-08-11
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine whether runtime-license checks apply
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${BASE_SHA:-}" ] || [[ "$BASE_SHA" =~ ^0+$ ]] ||
             ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED_FILES="$RUNNER_TEMP/noop-required-ci-changed-files.txt"
          git diff --no-renames --name-only "$BASE_SHA" "$GITHUB_SHA" \
            > "$CHANGED_FILES"
          if grep -Eq '(^|/)(Package\.resolved)$|^android/app/gradle\.lockfile$|^server/(requirements.*\.txt|requirements\.lock|Dockerfile|backup/Dockerfile|compose\.yaml)$|^ThirdPartyNotices/|^(LICENSE|NOTICE|ATTRIBUTION\.md|DISCLAIMER\.md|README\.md|TERMS\.md)$|^Strand/App/Terms\.swift$|^android/app/src/main/java/com/noop/ui/TermsGate\.kt$|^docs/provenance/|^Tools/(release-legal-gate\.py|tests/test_release_legal_gate\.py)$|^\.github/workflows/legal-inventory\.yml$' \
             "$CHANGED_FILES"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  runtime-license-inventory:
    name: runtime-license-inventory
    needs: [changes]
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned 2026-08-11
        with:
          persist-credentials: false
      - name: Verify exact runtime graph and bundled notices
        run: |
          python3 Tools/release-legal-gate.py check
          python3 -m unittest Tools/tests/test_release_legal_gate.py

  runtime-license-required:
    name: runtime-license-required
    needs: [changes, runtime-license-inventory]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every applicable runtime-license job
        env:
          APPLICABILITY_RESULT: ${{ needs.changes.result }}
          RUN_REQUIRED: ${{ needs.changes.outputs.run }}
          LICENSE_RESULT: ${{ needs.runtime-license-inventory.result }}
        run: |
          set -euo pipefail
          test "$APPLICABILITY_RESULT" = "success"
          if [ "$RUN_REQUIRED" = "true" ]; then
            test "$LICENSE_RESULT" = "success"
          else
            test "$RUN_REQUIRED" = "false"
            test "$LICENSE_RESULT" = "skipped"
          fi
