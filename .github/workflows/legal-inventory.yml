name: Runtime license inventory

on:
  pull_request:
    branches: [main]
    paths:
      - 'Package.resolved'
      - '**/Package.resolved'
      - 'android/app/gradle.lockfile'
      - 'server/requirements*.txt'
      - 'server/requirements.lock'
      - 'server/Dockerfile'
      - 'server/backup/Dockerfile'
      - 'server/compose.yaml'
      - 'ThirdPartyNotices/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'ATTRIBUTION.md'
      - 'DISCLAIMER.md'
      - 'README.md'
      - 'TERMS.md'
      - 'Strand/App/Terms.swift'
      - 'android/app/src/main/java/com/noop/ui/TermsGate.kt'
      - 'docs/provenance/**'
      - 'Tools/release-legal-gate.py'
      - 'Tools/tests/test_release_legal_gate.py'
      - '.github/workflows/legal-inventory.yml'
  push:
    branches: [main]
    paths:
      - 'Package.resolved'
      - '**/Package.resolved'
      - 'android/app/gradle.lockfile'
      - 'server/requirements*.txt'
      - 'server/requirements.lock'
      - 'server/Dockerfile'
      - 'server/backup/Dockerfile'
      - 'server/compose.yaml'
      - 'ThirdPartyNotices/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'ATTRIBUTION.md'
      - 'DISCLAIMER.md'
      - 'README.md'
      - 'TERMS.md'
      - 'Strand/App/Terms.swift'
      - 'android/app/src/main/java/com/noop/ui/TermsGate.kt'
      - 'docs/provenance/**'
      - 'Tools/release-legal-gate.py'
      - 'Tools/tests/test_release_legal_gate.py'
      - '.github/workflows/legal-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legal-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-license-inventory:
    name: runtime-license-inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned 2026-08-11
        with:
          persist-credentials: false
      - name: Verify exact runtime graph and bundled notices
        run: |
          python3 Tools/release-legal-gate.py check
          python3 -m unittest Tools/tests/test_release_legal_gate.py
