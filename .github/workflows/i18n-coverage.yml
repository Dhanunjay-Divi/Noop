# Catches translation drift BEFORE merge instead of after a user reports it (#326, #342, #448
# were all the same recurring pattern: new UI text lands without its German translation, or a
# Kotlin literal never gets wired to stringResource() at all since Compose has no Xcode-style
# auto-extraction). With the #453 backlog closed, Tools/i18n_audit.py --ci hard-fails on any
# hardcoded/un-extracted UI literal or any missing German, Spanish, or French translation across
# Android resources and all four Apple String Catalogs.
# Pure Python + git, no Xcode/Gradle: runs in seconds on ubuntu-latest, independent of the
# disabled-by-default app-build.yml / android.yml compile jobs.
name: i18n Coverage

on:
  pull_request:
    branches: [main]
  # Audit main itself too, not just PRs into it. The release workflow accepts only an already
  # reviewed version commit and reruns this audit before draft creation; this push trigger gives
  # that exact main SHA an independent whole-tree localization result. Same fast job.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: i18n-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i18n-coverage:
    name: i18n-coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned 2026-08-11
        with:
          fetch-depth: 0
          persist-credentials: false

      # `github.base_ref` is set ONLY for pull_request; on a push to main it is empty, which would
      # pass a bare `origin/`. Fall back to main. (The ref is retained for workflow compatibility —
      # `--ci` is a whole-tree gate, so the value it resolves to does not change the verdict.)
      - name: i18n audit (regression gate)
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: python3 Tools/i18n_audit.py --ci "origin/${BASE_REF}"
