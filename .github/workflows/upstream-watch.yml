name: Upstream watch

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-watch
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned 2026-08-11
        with:
          persist-credentials: false

      - name: Compare reviewed upstream state
        id: watch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 Tools/upstream_watch.py \
            --baseline docs/upstream-watch-baseline.json \
            --report "$RUNNER_TEMP/upstream-watch.md" \
            --snapshot "$RUNNER_TEMP/upstream-watch.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish the current snapshot as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, pinned 2026-08-11
        with:
          name: upstream-watch-snapshot
          path: |
            ${{ runner.temp }}/upstream-watch.md
            ${{ runner.temp }}/upstream-watch.json
          retention-days: 30

      - name: Open or refresh the single review issue
        if: steps.watch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Upstream watch: review required'
          body_file="$RUNNER_TEMP/upstream-watch.md"
          number="$(gh issue list --state open --search "$title in:title" --json number,title \
            --jq '.[] | select(.title == "Upstream watch: review required") | .number' | head -n 1)"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$body_file"
          else
            gh issue create --title "$title" --body-file "$body_file"
          fi

      - name: Close the review issue after the baseline catches up
        if: steps.watch.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Upstream watch: review required'
          gh issue list --state open --search "$title in:title" --json number,title \
            --jq '.[] | select(.title == "Upstream watch: review required") | .number' | \
          while read -r number; do
            [ -z "$number" ] || gh issue close "$number" \
              --comment 'Reviewed baseline now matches the monitored repositories.'
          done
