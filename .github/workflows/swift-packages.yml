# Compile-and-test verification for the reusable Swift packages.
#
# This job intentionally does NOT touch the macOS app target: that build needs
# XcodeGen to generate Strand.xcodeproj and a wired-up test scheme, and the app
# release is produced and anonymized by hand. The packages, by contrast, build
# and test on their own with plain SwiftPM — no Xcode project, no signing, no
# secrets — which makes them a safe, self-contained CI check that leaks nothing.
name: Swift Packages CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: swift-packages-applicability
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned 2026-08-11
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine whether Swift package checks apply
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${BASE_SHA:-}" ] || [[ "$BASE_SHA" =~ ^0+$ ]] ||
             ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED_FILES="$RUNNER_TEMP/noop-required-ci-changed-files.txt"
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > "$CHANGED_FILES"
          if grep -Eq '(^Packages/|^Tools/(Backfill|StudyHarness)/|^Tools/check-private-data\.py$|\.github/workflows/swift-packages\.yml$|\.(zip|csv|noopbak|sqlite|db)$)' \
             "$CHANGED_FILES"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  swift-packages:
    name: swift-packages (${{ matrix.package }})
    needs: [changes]
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        package:
          - WhoopProtocol
          - OuraProtocol
          - PolarProtocol
          - WhoopStore
          - StrandAnalytics
          - StrandImport
          - StrandDesign
          - NoopLocalAccess
          - NoopRemoteSync
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned 2026-08-11
        with:
          persist-credentials: false

      - name: Build ${{ matrix.package }}
        run: swift build
        working-directory: Packages/${{ matrix.package }}

      - name: Test ${{ matrix.package }}
        run: swift test
        working-directory: Packages/${{ matrix.package }}

  study-harness:
    name: study-harness
    needs: [changes]
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned 2026-08-11
        with:
          persist-credentials: false

      - name: Reject tracked personal-data artifacts
        run: python3 Tools/check-private-data.py

      - name: Build private study harness
        run: swift build
        working-directory: Tools/StudyHarness

      - name: Test private study harness
        run: swift test
        working-directory: Tools/StudyHarness

  history-harness:
    name: history-harness
    needs: [changes]
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned 2026-08-11
        with:
          persist-credentials: false

      - name: Build synthetic history harness
        run: swift build
        working-directory: Tools/Backfill

      - name: Test synthetic history harness
        run: swift test
        working-directory: Tools/Backfill

  swift-packages-required:
    name: swift-packages-required
    needs: [changes, swift-packages, study-harness, history-harness]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every applicable Swift package job
        env:
          APPLICABILITY_RESULT: ${{ needs.changes.result }}
          RUN_REQUIRED: ${{ needs.changes.outputs.run }}
          PACKAGES_RESULT: ${{ needs.swift-packages.result }}
          STUDY_RESULT: ${{ needs.study-harness.result }}
          HISTORY_RESULT: ${{ needs.history-harness.result }}
        run: |
          set -euo pipefail
          test "$APPLICABILITY_RESULT" = "success"
          if [ "$RUN_REQUIRED" = "true" ]; then
            test "$PACKAGES_RESULT" = "success"
            test "$STUDY_RESULT" = "success"
            test "$HISTORY_RESULT" = "success"
          else
            test "$RUN_REQUIRED" = "false"
            test "$PACKAGES_RESULT" = "skipped"
            test "$STUDY_RESULT" = "skipped"
            test "$HISTORY_RESULT" = "skipped"
          fi
