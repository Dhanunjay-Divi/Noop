# Fork-only: bump the version and cut a proper RELEASE (not a rolling snapshot) so the in-app
# "Check for updates" — which reads GitHub `releases/latest`, and GitHub excludes prereleases —
# points at this fork.
#
# The `bump` input (patch / minor / major / none) increments the version IN SOURCE — both
# android/app/build.gradle.kts (versionName + versionCode) and project.yml (MARKETING_VERSION +
# CURRENT_PROJECT_VERSION) — and commits that to the dispatched branch, so the built app actually
# REPORTS the new version. Then it publishes a fixed, non-prerelease `v<VERSION>` release with the
# version-stamped artifacts. A new release remains a draft until every platform
# artifact is attached and a publicly fetchable AltStore source is verified on `main`; only then
# is it published as latest, so a failed build cannot strand users on an
# empty/incomplete release. UpdateCheck finds the
# published release (isNewer strips the `-staging` suffix, so an installed
# staging build compares clean).
#
# Contrast with fork-testing-build.yml: THAT publishes the rolling `testing-latest` PRERELEASE (a
# snapshot), which releases/latest deliberately ignores. THIS never touches testing-latest.
name: Release build (fork)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (patch = 0.0.x, minor = 0.x.0, major = x.0.0)"
        type: choice
        options: [patch, minor, major, none]
        default: patch
      version:
        description: "Explicit version override, e.g. 8.3.0 (blank = apply the bump above)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: false   # never cancel a release mid-publish

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.b.outputs.ver }}
      tag: ${{ steps.b.outputs.tag }}
      sha: ${{ steps.b.outputs.sha }}
      buildVersion: ${{ steps.b.outputs.buildVersion }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned 2026-08-11
        with:
          # A workflow re-run keeps its original event SHA. Build from the
          # latest requested branch instead, while retaining full history so
          # the original SHA can determine the idempotent target version below.
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Enforce redistribution provenance and notices
        run: python3 Tools/release-legal-gate.py distribution
      - name: Reject unsupported health and delivery claims
        run: |
          python3 -m unittest Tools.tests.test_health_claims_gate
          python3 Tools/health_claims_gate.py
      - name: Require private Android staging signing secrets
        env:
          ANDROID_STAGING_KEYSTORE_BASE64: ${{ secrets.ANDROID_STAGING_KEYSTORE_BASE64 }}
          ANDROID_STAGING_STORE_PASSWORD: ${{ secrets.ANDROID_STAGING_STORE_PASSWORD }}
          ANDROID_STAGING_KEY_ALIAS: ${{ secrets.ANDROID_STAGING_KEY_ALIAS }}
          ANDROID_STAGING_KEY_PASSWORD: ${{ secrets.ANDROID_STAGING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            ANDROID_STAGING_KEYSTORE_BASE64 \
            ANDROID_STAGING_STORE_PASSWORD \
            ANDROID_STAGING_KEY_ALIAS \
            ANDROID_STAGING_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required Actions secret ${name}; refusing to publish an Android artifact with a public/debug signing identity."
              exit 1
            fi
          done
      - id: b
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ github.event.inputs.bump }}
          OVERRIDE: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          GRADLE=android/app/build.gradle.kts

          # Android versionName is the source of truth UpdateCheck compares
          # against. Compute the requested version from the immutable dispatch
          # SHA, not the latest checkout: GitHub's one-click re-run keeps that
          # original SHA, so a retry targets the same version instead of
          # accidentally incrementing twice.
          CUR=$(grep -m1 'versionName = "' "$GRADLE" | sed -E 's/.*"([^"]+)".*/\1/')
          BASE_GRADLE=$(git show "${GITHUB_SHA}:${GRADLE}") || {
            echo "::error::Cannot read ${GRADLE} at dispatch SHA ${GITHUB_SHA}."
            exit 1
          }
          BASE_CUR=$(grep -m1 'versionName = "' <<<"$BASE_GRADLE" | sed -E 's/.*"([^"]+)".*/\1/')
          IFS=. read -r MA MI PA <<< "$BASE_CUR"; MA=${MA:-0}; MI=${MI:-0}; PA=${PA:-0}
          case "${BUMP:-patch}" in
            major) NEW="$((MA+1)).0.0" ;;
            minor) NEW="${MA}.$((MI+1)).0" ;;
            patch) NEW="${MA}.${MI}.$((PA+1))" ;;
            none|"") NEW="$BASE_CUR" ;;
            *) echo "Unknown bump: $BUMP" >&2; exit 1 ;;
          esac
          [ -n "${OVERRIDE:-}" ] && NEW="$OVERRIDE"
          [[ "$NEW" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid release version: ${NEW}"
            exit 1
          }
          if [ "$CUR" != "$BASE_CUR" ] && [ "$CUR" != "$NEW" ]; then
            echo "::error::This run targets ${NEW}, but ${GITHUB_REF_NAME} is already ${CUR}. Dispatch a fresh release run."
            exit 1
          fi
          TAG="v${NEW}"
          echo "ver=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version: dispatch base $BASE_CUR; branch $CUR -> target $NEW (tag $TAG)"

          if [ "$NEW" != "$CUR" ]; then
            # Bump BOTH platforms' version + build number in source, then commit to the branch so the
            # built artifacts report $NEW (each build number is an independent monotonic counter).
            ACODE=$(grep -m1 'versionCode = ' "$GRADLE" | sed -E 's/.*versionCode = ([0-9]+).*/\1/')
            ICODE=$(grep -m1 'CURRENT_PROJECT_VERSION:' project.yml | sed -E 's/.*"([0-9]+)".*/\1/')
            sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"$NEW\"/" "$GRADLE"
            sed -i -E "s/versionCode = [0-9]+/versionCode = $((ACODE+1))/" "$GRADLE"
            sed -i -E "s/MARKETING_VERSION: \"[^\"]+\"/MARKETING_VERSION: \"$NEW\"/" project.yml
            sed -i -E "s/CURRENT_PROJECT_VERSION: \"[0-9]+\"/CURRENT_PROJECT_VERSION: \"$((ICODE+1))\"/" project.yml
            # In-app "What's New": generate the AppChangelog entry (both platforms) + bump its constant
            # from docs/releases/<TAG>.md's whatsnew: front-matter, so the in-app card ships in sync with
            # this version. Release notes and localization are mandatory: stop before committing/pushing
            # if either gate fails, rather than publishing an app whose visible version and changelog differ.
            NOTES_MD="docs/releases/${TAG}.md"
            if [ ! -f "$NOTES_MD" ]; then
              echo "::error::Missing ${NOTES_MD}; prepare and localize the release entry before dispatching."
              exit 1
            fi
            python3 -m pip install --quiet pyyaml
            python3 Tools/appchangelog-gen.py "$NOTES_MD"
            python3 Tools/i18n_audit.py --ci HEAD
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -am "Release ${NEW}: bump version (${BUMP}) + build numbers + What's New"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # The iOS build number (CURRENT_PROJECT_VERSION as it now stands in project.yml, bumped or not),
          # for the AltStore manifest's buildVersion.
          echo "buildVersion=$(grep -m1 'CURRENT_PROJECT_VERSION:' project.yml | sed -E 's/.*\"([0-9]+)\".*/\1/')" >> "$GITHUB_OUTPUT"

          # Keep the immutable release as a DRAFT at the (possibly bumped)
          # commit until all three platform artifacts and the AltStore source
          # are complete. A retry may refresh an existing draft, but it must
          # never pull an already-published immutable release back into draft.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Release $TAG is already published and immutable; refusing to replace it."
              exit 1
            fi
            echo "Release $TAG already exists as a draft — refreshing its target and assets."
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --target "$(git rev-parse HEAD)"
          else
            # Release body = the required per-version changelog docs/releases/<TAG>.md, plus a
            # downloads footer. (CHANGELOG.md is the stale legacy file; docs/releases/ is the source
            # of truth, and the pre-push gate above rejects a missing/malformed file.)
            BODY=$(mktemp)
            NOTES_MD="docs/releases/${TAG}.md"
            if [ -f "$NOTES_MD" ]; then
              # Strip a leading YAML front-matter block (the `whatsnew:` used by appchangelog-gen) so it
              # never leaks into the GitHub release body; files without front-matter pass through unchanged.
              awk 'NR==1 && $0=="---"{fm=1; next} fm && $0=="---"{fm=0; next} !fm{print}' "$NOTES_MD" > "$BODY"
            else
              echo "::error::Missing ${NOTES_MD}; refusing to create a placeholder release."
              exit 1
            fi
            # Auto "What's Changed" breakdown: GitHub's generate-notes API lists every merged PR since the
            # previous RELEASE (non-prerelease, so testing-latest snapshots are ignored), + contributors +
            # a full-changelog compare link. Appended below the curated notes. Skipped on the very first
            # release (no prior tag → the diff would run to repo start). Best-effort: a failure is ignored.
            PREV=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
              --json tagName,isPrerelease,isDraft \
              --jq 'map(select(.isPrerelease==false and .isDraft==false)) | .[0].tagName // empty' 2>/dev/null || true)
            if [ -n "$PREV" ]; then
              AUTO=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                -f tag_name="$TAG" -f previous_tag_name="$PREV" -f target_commitish="$(git rev-parse HEAD)" \
                --jq '.body' 2>/dev/null || true)
              # Drop the per-PR "by @author" credit and any "New Contributors" block — this is a solo fork,
              # so the auto notes needn't stamp the handle on every line. Keeps the PR titles + links.
              AUTO=$(printf '%s' "$AUTO" \
                | sed -E 's/ by @[A-Za-z0-9_-]+//g' \
                | awk 'BEGIN{skip=0} /^#+ *New Contributors/{skip=1; next} /^#+ /{skip=0} skip{next} {print}')
              [ -n "$AUTO" ] && printf '\n---\n\n%s\n' "$AUTO" >> "$BODY"
            else
              echo "First release (no prior release tag) — skipping the auto PR breakdown."
            fi
            {
              printf '\n---\n\n**Downloads** — access follows repository visibility; private-repository assets require an authenticated collaborator:\n'
              printf -- '- **Android** — `NOOP-android-v%s.apk` (privately signed staging identity, `com.noop.whoop.staging`, non-debuggable and unminified; SHA-256 sidecar and CycloneDX SBOM included)\n' "$NEW"
              printf -- '- **macOS** — `NOOP-macos-v%s.zip` (unzip, then right-click → Open)\n' "$NEW"
              printf -- '- **iOS** — `NOOP-ios-unsigned-v%s.ipa` (AltStore / Sideloadly)\n' "$NEW"
            } >> "$BODY"
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --target "$(git rev-parse HEAD)" \
              --title "NOOP ${NEW}" --notes-file "$BODY"
          fi

  android_tests:
    needs: bump
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned 2026-08-11
        with:
          ref: ${{ needs.bump.outputs.sha }}   # build the bumped commit
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0, pinned 2026-08-11
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2, pinned 2026-08-11
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2, pinned 2026-08-11
      - name: Run Android unit tests before release signing
        run: ./gradlew testFullDebugUnitTest

  android:
    needs: [bump, android_tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned 2026-08-11
        with:
          ref: ${{ needs.bump.outputs.sha }}   # build the bumped commit
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0, pinned 2026-08-11
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2, pinned 2026-08-11
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2, pinned 2026-08-11
      - name: Prepare private staging signing key
        env:
          ANDROID_STAGING_KEYSTORE_BASE64: ${{ secrets.ANDROID_STAGING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_STAGING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/noop-staging.jks"
          test -s "$RUNNER_TEMP/noop-staging.jks"
      - name: Build privately signed staging-release APK
        env:
          NOOP_RELEASE_STORE_FILE: ${{ runner.temp }}/noop-staging.jks
          NOOP_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STAGING_STORE_PASSWORD }}
          NOOP_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_STAGING_KEY_ALIAS }}
          NOOP_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_STAGING_KEY_PASSWORD }}
        run: ./gradlew assembleFullRelease -PstagingRelease
      - name: Verify APK signature matches the configured release identity
        env:
          NOOP_RELEASE_STORE_FILE: ${{ runner.temp }}/noop-staging.jks
          NOOP_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STAGING_STORE_PASSWORD }}
          NOOP_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_STAGING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/full/release -type f -name '*.apk' -print -quit)
          test -n "$APK"
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$ANDROID_SDK"
          BUILD_TOOLS=$(find "$ANDROID_SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          EXPECTED=$(keytool -list -v -keystore "$NOOP_RELEASE_STORE_FILE" \
            -storepass:env NOOP_RELEASE_STORE_PASSWORD -alias "$NOOP_RELEASE_KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" \
            | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test -n "$EXPECTED" && test -n "$ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::APK signer certificate does not match the configured release key."
            exit 1
          fi
      - name: Version, checksum, inventory + attach
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.bump.outputs.ver }}
          TAG: ${{ needs.bump.outputs.tag }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/full/release/*.apk "NOOP-android-v${VER}.apk"
          sha256sum "NOOP-android-v${VER}.apk" > "NOOP-android-v${VER}.apk.sha256"
          python3 ../Tools/android-lockfile-sbom.py app/gradle.lockfile \
            "NOOP-android-v${VER}.cdx.json" "$VER"
          python3 -m json.tool "NOOP-android-v${VER}.cdx.json" >/dev/null
          [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "true" ] || {
            echo "::error::Release $TAG is already published; refusing to replace its Android asset."
            exit 1
          }
          gh release upload "$TAG" \
            "NOOP-android-v${VER}.apk" \
            "NOOP-android-v${VER}.apk.sha256" \
            "NOOP-android-v${VER}.cdx.json" \
            --repo "$GITHUB_REPOSITORY" --clobber

  macos:
    needs: bump
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned 2026-08-11
        with:
          ref: ${{ needs.bump.outputs.sha }}
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build NOOP.app (macOS, unsigned, universal)
        # #51: 'platform=macOS' on an Apple-Silicon runner resolves to the host arch and thins the binary to
        # arm64-only (project.yml's ONLY_ACTIVE_ARCH: NO is set only under configs.Release, so the Debug build
        # inherits the default YES). That shipped an arm64-only app that won't launch on Intel Macs. Force a
        # true universal build with the generic destination + explicit ARCHS/ONLY_ACTIVE_ARCH; these
        # command-line settings override the config, so it stays Debug (unchanged shipping behaviour).
        run: >-
          xcodebuild -scheme Strand -configuration Debug
          -destination 'generic/platform=macOS' ARCHS="x86_64 arm64" ONLY_ACTIVE_ARCH=NO
          -derivedDataPath build/dd
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          build
      - name: Verify universal binary
        run: |
          APP=$(find build/dd/Build/Products -maxdepth 3 -name '*.app' -type d | head -1)
          EXE=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f ! -name '*.dylib' | head -1)
          echo "archs: $(lipo -archs "$EXE")"
          { lipo -archs "$EXE" | grep -qw x86_64 && lipo -archs "$EXE" | grep -qw arm64; } \
            || { echo "::error::macOS binary is not universal (expected x86_64 + arm64)"; exit 1; }
      - name: Package + attach
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.bump.outputs.ver }}
          TAG: ${{ needs.bump.outputs.tag }}
        run: |
          APP=$(find build/dd/Build/Products -maxdepth 3 -name '*.app' -type d | head -1)
          test -n "$APP" || { echo ".app not found"; exit 1; }
          # #429: ad-hoc sign the BUNDLE so it has a stable per-build code identity. macOS 26 (Tahoe) won't
          # bind a Bluetooth TCC grant to an UNSIGNED bundle, so users wedge at CBManagerState .unauthorized
          # even after a fresh `tccutil reset` + approve. `--sign -` gives a real cdhash-based designated
          # requirement TCC can grant to. No --entitlements / --options runtime: stays non-sandboxed so BT
          # goes through plain TCC + the Info.plist usage string. (cdhash still changes per build, so a
          # future UPDATE still needs the re-toggle the in-app #429/#295 banner already describes.)
          codesign --force --deep --sign - "$APP"
          codesign -dvv "$APP" 2>&1 | grep -Ei 'identifier|signature|flags' || true
          ditto -c -k --keepParent "$APP" "NOOP-macos-v${VER}.zip"
          [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "true" ] || {
            echo "::error::Release $TAG is already published; refusing to replace its macOS asset."
            exit 1
          }
          gh release upload "$TAG" "NOOP-macos-v${VER}.zip" --repo "$GITHUB_REPOSITORY" --clobber

  ios:
    needs: bump
    # iOS 26 Liquid Glass (glassEffect) needs the iOS 26 SDK → Xcode 26 → macos-26.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned 2026-08-11
        with:
          ref: ${{ needs.bump.outputs.sha }}
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build NOOPiOS for device (unsigned, Release)
        # #53: build RELEASE, not Debug. A Debug build carries get-task-allow + debug artifacts that make a
        # re-signed sideload fail "integrity could not be verified" on modern iOS; Release (the correct config
        # for a distributed app) installs clean — confirmed by the reporter's own Release build.
        run: >-
          xcodebuild -scheme NOOPiOS -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath build/dd
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          build
      - name: Package sideload .ipa (strip watch, preserve app/widget capabilities) + attach
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.bump.outputs.ver }}
          TAG: ${{ needs.bump.outputs.tag }}
        run: |
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP" || { echo ".app (iphoneos) not found"; exit 1; }
          rm -rf "$APP/Watch"
          # Keep NOOPWidgets.appex. It renders both the Home/Lock-Screen widgets AND the Live Activity;
          # deleting PlugIns still lets ActivityKit create an activity, but iOS can only show an empty
          # Dynamic Island shell because its renderer is gone.
          test -d "$APP/PlugIns/NOOPWidgets.appex" || {
            echo "NOOPWidgets.appex missing from iOS build"; exit 1;
          }
          Tools/prepare-ios-sideload-app.sh "$APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qr "NOOP-ios-unsigned-v${VER}.ipa" Payload
          [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "true" ] || {
            echo "::error::Release $TAG is already published; refusing to replace its iOS asset."
            exit 1
          }
          gh release upload "$TAG" "NOOP-ios-unsigned-v${VER}.ipa" --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: [bump, android, macos, ios, altstore]
    runs-on: ubuntu-latest
    steps:
      - name: Verify assets and publish as latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.bump.outputs.tag }}
          VER: ${{ needs.bump.outputs.ver }}
        run: |
          set -euo pipefail
          ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for expected in \
            "NOOP-android-v${VER}.apk" \
            "NOOP-android-v${VER}.apk.sha256" \
            "NOOP-android-v${VER}.cdx.json" \
            "NOOP-macos-v${VER}.zip" \
            "NOOP-ios-unsigned-v${VER}.ipa"
          do
            if ! grep -Fxq "$expected" <<<"$ASSETS"; then
              echo "::error::release $TAG is missing $expected"
              exit 1
            fi
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease=false --latest

  # Prepend this release to the AltStore / SideStore source manifest only when GitHub reports the
  # repository as public. AltStore cannot authenticate to private raw/release URLs. This is a
  # required publication gate:
  # the GitHub release remains a draft unless the manifest is updated and
  # verified on main.
  altstore:
    needs: [bump, android, macos, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned 2026-08-11
        with:
          ref: main   # Public AltStore clients read the manifest from main.
          fetch-depth: 0
      - name: Require anonymously fetchable GitHub distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VISIBILITY=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.visibility')
          if [ "$VISIBILITY" != "public" ]; then
            echo "::error::Repository visibility is ${VISIBILITY}. AltStore/SideStore cannot authenticate to private raw GitHub files or private release assets; refusing to publish a misleading source entry. Make the repository public or move the manifest, icon, and IPA to an intentionally public HTTPS host first."
            exit 1
          fi
      - name: Add this release to the AltStore source
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.bump.outputs.ver }}
          TAG: ${{ needs.bump.outputs.tag }}
          BUILD: ${{ needs.bump.outputs.buildVersion }}
        run: |
          set -euo pipefail
          [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "true" ] || {
            echo "::error::Release $TAG is already published; refusing to rewrite its AltStore entry."
            exit 1
          }
          if [ ! -f altstore-source.json ]; then
            echo "::error::no altstore-source.json on main; refusing to publish without an installable source."
            exit 1
          fi
          IPA="NOOP-ios-unsigned-v${VER}.ipa"
          # The freshly-uploaded IPA's byte size, straight off the release asset (the `ios` job just pushed it).
          SIZE=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | select(.name=="'"$IPA"'") | .size')
          if [ -z "${SIZE:-}" ]; then
            echo "::error::IPA asset $IPA not found on release $TAG."
            exit 1
          fi
          [ -n "${BUILD:-}" ] || BUILD=$(grep -m1 'CURRENT_PROJECT_VERSION:' project.yml | sed -E 's/.*"([0-9]+)".*/\1/')
          DATE=$(date -u +%Y-%m-%d)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${IPA}"
          DESC="NOOP ${VER}. See the release notes for what changed."
          MINOS=$(jq -r '.apps[0].minOSVersion // "17.0"' altstore-source.json)

          # Prepend to versions[] (dedup this version so a re-run is idempotent) AND mirror into the
          # app-level legacy fields older AltStore clients read, so both source shapes point at this release.
          tmp=$(mktemp)
          jq \
            --arg v "$VER" --arg b "$BUILD" --arg d "$DATE" --arg desc "$DESC" \
            --arg url "$URL" --argjson size "$SIZE" --arg min "$MINOS" \
            '
            .apps[0].versions |= ([{
                version: $v, buildVersion: $b, date: $d,
                localizedDescription: $desc, downloadURL: $url, size: $size, minOSVersion: $min
              }] + (map(select(.version != $v))))
            | .apps[0].version            = $v
            | .apps[0].buildVersion       = $b
            | .apps[0].versionDate        = $d
            | .apps[0].versionDescription = $desc
            | .apps[0].downloadURL        = $url
            | .apps[0].size               = $size
            ' altstore-source.json > "$tmp" && mv "$tmp" altstore-source.json

          jq -e \
            --arg v "$VER" --arg b "$BUILD" --arg url "$URL" --argjson size "$SIZE" \
            '
              .apps[0].versions[0].version == $v
              and .apps[0].versions[0].buildVersion == $b
              and .apps[0].versions[0].downloadURL == $url
              and .apps[0].versions[0].size == $size
              and .apps[0].version == $v
              and .apps[0].buildVersion == $b
              and .apps[0].downloadURL == $url
              and .apps[0].size == $size
            ' altstore-source.json >/dev/null

          if git diff --quiet altstore-source.json; then
            echo "altstore-source.json already current for ${VER}."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add altstore-source.json
            git commit -m "Release ${VER}: add to AltStore source"
            git push origin HEAD:main
          fi

          REMOTE_SHA=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          [ "$REMOTE_SHA" = "$(git rev-parse HEAD)" ] || {
            echo "::error::main does not contain the AltStore manifest commit."
            exit 1
          }
          git show "${REMOTE_SHA}:altstore-source.json" | jq -e \
            --arg v "$VER" --arg b "$BUILD" --arg url "$URL" --argjson size "$SIZE" \
            '
              .apps[0].versions[0].version == $v
              and .apps[0].versions[0].buildVersion == $b
              and .apps[0].versions[0].downloadURL == $url
              and .apps[0].versions[0].size == $size
              and .apps[0].version == $v
              and .apps[0].buildVersion == $b
              and .apps[0].downloadURL == $url
              and .apps[0].size == $size
            ' >/dev/null
