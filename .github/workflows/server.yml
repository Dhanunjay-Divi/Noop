# Validate the optional self-hosted API against both memory and TimescaleDB storage.
name: Self-hosted Server CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:2.20.3-pg16@sha256:559615191e7249779e5f83a74f01d309bce299bfadd6d3177d7a7b99610eef89
        env:
          POSTGRES_DB: noop
          POSTGRES_USER: noop
          POSTGRES_PASSWORD: noop-ci-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noop -d noop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NOOP_TEST_DATABASE_URL: postgresql://noop:noop-ci-database-password@127.0.0.1:5432/noop
      NOOP_TEST_POSTGRESQL_DATABASE_URL: postgresql://noop:noop-ci-database-password@127.0.0.1:5432/noop_postgresql
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned 2026-08-11
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, pinned 2026-08-11
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            server/requirements.lock
            server/requirements-dev.txt

      - name: Verify exact runtime notices and lock
        run: python3 ../Tools/release-legal-gate.py check

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Create isolated PostgreSQL-overlay test database
        env:
          PGPASSWORD: noop-ci-database-password
        run: >-
          createdb
          --host 127.0.0.1
          --port 5432
          --username noop
          noop_postgresql

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Audit Python dependencies
        run: |
          pip-audit --requirement requirements.lock
          pip-audit --requirement requirements-dev.txt

      - name: Test API and wire contract
        run: pytest

      - name: Validate backup scripts and Compose model
        env:
          NOOP_API_TOKEN: noop-ci-api-token-that-is-at-least-32-bytes
          NOOP_DB_PASSWORD: noop-ci-database-password
          NOOP_BACKUP_SECRET_FILE: /dev/null
        run: |
          for script in backup/*.sh; do sh -n "$script"; done
          docker compose config --quiet

      - name: Build production container
        run: docker build --tag noop-server-ci .

      - name: Build encrypted-backup container
        run: docker build --tag noop-server-backup-ci backup

      - name: Exercise encrypted backup and disposable restore drill
        env:
          PGPASSWORD: noop-ci-database-password
        run: |
          backup_secret="${RUNNER_TEMP}/noop-backup-passphrase"
          openssl rand -base64 48 > "$backup_secret"
          chmod 0444 "$backup_secret"
          docker volume create noop-ci-encrypted-backups
          trap 'docker volume rm --force noop-ci-encrypted-backups >/dev/null' EXIT
          docker run --rm --network host --read-only \
            --tmpfs /tmp:size=2g,noexec,nosuid \
            --tmpfs /var/lib/postgresql:size=1m,noexec,nosuid \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e PGHOST=127.0.0.1 \
            -e PGPORT=5432 \
            -e PGDATABASE=noop \
            -e PGUSER=noop \
            -e PGPASSWORD \
            -e NOOP_BACKUP_PASSPHRASE_FILE=/run/secrets/noop_backup_passphrase \
            -v "$backup_secret:/run/secrets/noop_backup_passphrase:ro" \
            -v noop-ci-encrypted-backups:/backups \
            noop-server-backup-ci sh -c \
              'sh /opt/noop/backup.sh && sh /opt/noop/backup-healthcheck.sh'
          docker run --rm --network host --read-only \
            --tmpfs /tmp:size=2g,noexec,nosuid \
            --tmpfs /var/lib/postgresql:size=1m,noexec,nosuid \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e PGHOST=127.0.0.1 \
            -e PGPORT=5432 \
            -e PGDATABASE=noop \
            -e PGUSER=noop \
            -e PGPASSWORD \
            -e NOOP_BACKUP_PASSPHRASE_FILE=/run/secrets/noop_backup_passphrase \
            -v "$backup_secret:/run/secrets/noop_backup_passphrase:ro" \
            -v noop-ci-encrypted-backups:/backups \
            noop-server-backup-ci sh -c \
              'archive=$(find /backups -maxdepth 1 -name "noop-*.dump.gpg" -print -quit); test -n "$archive"; exec sh /opt/noop/restore-drill.sh "$archive"'
