# Compile-and-test verification for the Android app.
#
# Debug build only, with unit, lint, and managed-device tests. There is no
# release signing config, keystore, or secret. Only bounded test diagnostics
# are retained; release APKs remain built and signed through the release flow.
name: Android CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned 2026-08-11
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0, pinned 2026-08-11
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2, pinned 2026-08-11

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2, pinned 2026-08-11

      - name: Build debug APK
        run: ./gradlew assembleFullDebug

      - name: Run unit tests
        run: ./gradlew testFullDebugUnitTest

      - name: Run lint
        run: ./gradlew lintFullDebug

      - name: Compile instrumentation tests
        run: ./gradlew compileFullDebugAndroidTestKotlin

  production-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned 2026-08-11
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0, pinned 2026-08-11
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2, pinned 2026-08-11

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2, pinned 2026-08-11

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prove Review Sample worker isolation in a fresh process
        run: |
          ./gradlew pixel2Api35FullDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.noop.ui.ReviewSampleInstrumentedTest \
            -Pandroid.testInstrumentationRunnerArguments.requireFreshWorkManager=true \
            --stacktrace

      - name: Run production-shell instrumentation tests
        run: ./gradlew pixel2Api35FullDebugAndroidTest --stacktrace

      - name: Retain managed-device diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, pinned 2026-04-10
        with:
          name: android-managed-device-diagnostics
          path: |
            android/app/build/reports/androidTests/managedDevice/
            android/app/build/outputs/androidTest-results/managedDevice/
          if-no-files-found: warn
          retention-days: 14
