# Compile-and-test verification for the Android app.
#
# Debug build only, with unit, lint, and managed-device tests. There is no
# release signing config, keystore, or secret. Only bounded test diagnostics
# are retained; release APKs remain built and signed through the release flow.
name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: android-applicability
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned 2026-08-11
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine whether Android checks apply
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${BASE_SHA:-}" ] || [[ "$BASE_SHA" =~ ^0+$ ]] ||
             ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED_FILES="$RUNNER_TEMP/noop-required-ci-changed-files.txt"
          git diff --no-renames --name-only "$BASE_SHA" "$GITHUB_SHA" \
            > "$CHANGED_FILES"
          if grep -Eq '^(android/|Tools/android-managed-device-retry\.py$|\.github/workflows/android\.yml$)' \
             "$CHANGED_FILES"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    needs: [changes]
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned 2026-08-11
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0, pinned 2026-08-11
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2, pinned 2026-08-11

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2, pinned 2026-08-11

      - name: Build debug APK
        run: ./gradlew assembleFullDebug

      - name: Run unit tests
        run: ./gradlew testFullDebugUnitTest

      - name: Run lint
        run: ./gradlew lintFullDebug

      - name: Compile instrumentation tests
        run: ./gradlew compileFullDebugAndroidTestKotlin

  production-shell:
    needs: [changes]
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned 2026-08-11
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0, pinned 2026-08-11
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2, pinned 2026-08-11

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2, pinned 2026-08-11

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prove Review Sample worker isolation in a fresh process
        id: review_sample_first
        continue-on-error: true
        run: |
          ./gradlew pixel2Api35FullDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.noop.ui.ReviewSampleInstrumentedTest \
            -Pandroid.testInstrumentationRunnerArguments.requireFreshWorkManager=true \
            --no-configuration-cache \
            --stacktrace

      - name: Classify a zero-test managed-device infrastructure loss
        if: ${{ steps.review_sample_first.outcome == 'failure' }}
        id: review_sample_retry
        run: |
          python3 ../Tools/android-managed-device-retry.py \
            app/build/outputs/androidTest-results/managedDevice \
            --github-output "$GITHUB_OUTPUT"
          echo "::warning title=Managed-device infrastructure retry::Android activity service disappeared before tests started; retrying once."

      - name: Retry Review Sample isolation once on proven infrastructure loss
        if: >-
          ${{
            steps.review_sample_first.outcome == 'failure' &&
            steps.review_sample_retry.outputs.retry == 'true'
          }}
        run: |
          ./gradlew --stop
          ./gradlew pixel2Api35FullDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.noop.ui.ReviewSampleInstrumentedTest \
            -Pandroid.testInstrumentationRunnerArguments.requireFreshWorkManager=true \
            --no-configuration-cache \
            --rerun-tasks \
            --stacktrace

      - name: Run production-shell instrumentation tests
        run: ./gradlew pixel2Api35FullDebugAndroidTest --stacktrace

      - name: Retain managed-device diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, pinned 2026-04-10
        with:
          name: android-managed-device-diagnostics
          path: |
            android/app/build/reports/androidTests/managedDevice/
            android/app/build/outputs/androidTest-results/managedDevice/
          if-no-files-found: warn
          retention-days: 14

  android-ci-required:
    name: android-ci-required
    needs: [changes, build-and-test, production-shell]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every applicable Android job
        env:
          APPLICABILITY_RESULT: ${{ needs.changes.result }}
          RUN_REQUIRED: ${{ needs.changes.outputs.run }}
          BUILD_RESULT: ${{ needs.build-and-test.result }}
          SHELL_RESULT: ${{ needs.production-shell.result }}
        run: |
          set -euo pipefail
          test "$APPLICABILITY_RESULT" = "success"
          if [ "$RUN_REQUIRED" = "true" ]; then
            test "$BUILD_RESULT" = "success"
            test "$SHELL_RESULT" = "success"
          else
            test "$RUN_REQUIRED" = "false"
            test "$BUILD_RESULT" = "skipped"
            test "$SHELL_RESULT" = "skipped"
          fi
