name: Forgejo release mirror

on:
  workflow_call:
    inputs:
      version:
        description: Published production version to mirror, for example 9.2.1
        required: true
        type: string
    secrets:
      NOOP_FORGEJO_TOKEN:
        description: Write token scoped only to the configured Forgejo repository
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Published production version to mirror, for example 9.2.1
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: forgejo-release
  cancel-in-progress: false

jobs:
  mirror-forgejo-release:
    name: mirror-forgejo-release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact protected-main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned 2026-08-11
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact protected-main source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Mirror verified canonical release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          FORGE_DOMAIN: ${{ vars.NOOP_FORGEJO_DOMAIN }}
          FORGE_ORG: ${{ vars.NOOP_FORGEJO_ORG }}
          FORGE_REPO: ${{ vars.NOOP_FORGEJO_REPO }}
          NOOP_FORGEJO_TOKEN: ${{ secrets.NOOP_FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid Forgejo source version."
            exit 1
          }
          for name in FORGE_DOMAIN FORGE_ORG FORGE_REPO NOOP_FORGEJO_TOKEN; do
            test -n "${!name:-}" || {
              echo "::error::Missing required Forgejo mirror configuration: ${name}."
              exit 1
            }
          done

          TAG="v${VERSION}"
          RELEASE=$(
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease,assets,body
          )
          [ "$(jq -r '.isDraft' <<<"$RELEASE")" = "false" ] || {
            echo "::error::Release $TAG is still a draft."
            exit 1
          }
          [ "$(jq -r '.isPrerelease' <<<"$RELEASE")" = "false" ] || {
            echo "::error::Release $TAG is a prerelease."
            exit 1
          }

          RELEASE_SHA=$(git rev-parse "${TAG}^{commit}")
          git merge-base --is-ancestor "$RELEASE_SHA" "$GITHUB_SHA" || {
            echo "::error::Published release $TAG is not contained in protected main."
            exit 1
          }
          GH_TOKEN="$GH_TOKEN" python3 Tools/required-ci-gate.py verify-github \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$RELEASE_SHA"
          APPLE_VERSION=$(git show "${TAG}:project.yml" |
            sed -n 's/.*MARKETING_VERSION: "\([^"]*\)".*/\1/p' | head -1)
          ANDROID_VERSION=$(git show "${TAG}:android/app/build.gradle.kts" |
            sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' | head -1)
          test "$APPLE_VERSION" = "$VERSION"
          test "$ANDROID_VERSION" = "$VERSION"

          DOWNLOAD_DIR="$RUNNER_TEMP/forgejo-release"
          mkdir -p "$DOWNLOAD_DIR"
          EXPECTED_ASSETS=(
            "NOOP-android-v${VERSION}.apk"
            "NOOP-android-v${VERSION}.apk.sha256"
            "NOOP-android-v${VERSION}.cdx.json"
            "NOOP-macos-v${VERSION}.zip"
            "NOOP-ios-unsigned-v${VERSION}.ipa"
          )
          for asset in "${EXPECTED_ASSETS[@]}"; do
            COUNT=$(jq --arg asset "$asset" \
              '[.assets[] | select(.name == $asset)] | length' <<<"$RELEASE")
            [ "$COUNT" = "1" ] || {
              echo "::error::Published release $TAG does not contain exactly one $asset."
              exit 1
            }
            SIZE=$(jq -r --arg asset "$asset" \
              '.assets[] | select(.name == $asset) | .size' <<<"$RELEASE")
            [[ "$SIZE" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::Published release $TAG has an invalid $asset size."
              exit 1
            }
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" --dir "$DOWNLOAD_DIR"
            test "$(stat -c %s "$DOWNLOAD_DIR/$asset")" = "$SIZE"
          done
          (
            cd "$DOWNLOAD_DIR"
            sha256sum --check "NOOP-android-v${VERSION}.apk.sha256"
          )

          NOTES=$(jq -r '.body' <<<"$RELEASE")
          export FORGE_TARGET_COMMITISH="$RELEASE_SHA"
          Tools/forgejo-release.sh "$VERSION" \
            "${EXPECTED_ASSETS[@]/#/$DOWNLOAD_DIR/}" \
            -- "$NOTES"
