[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "noop-self-hosted"
version = "0.1.0"
description = "Opt-in self-hosted storage for Noop biometric data"
requires-python = ">=3.11"
dependencies = [
  "asyncpg==0.30.0",
  "cryptography==50.0.1",
  "fastapi==0.139.2",
  "PyJWT[crypto]==2.13.0",
  "pydantic==2.11.4",
  "starlette==1.3.1",
  "uvicorn[standard]==0.34.2",
]

[project.optional-dependencies]
test = [
  "httpx2==2.9.0",
  "pip-audit==2.10.1",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
