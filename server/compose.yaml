name: noop

x-noop-database-environment: &noop-database-environment
  NOOP_DATABASE_ENGINE: ${NOOP_DATABASE_ENGINE:-timescaledb}
  NOOP_DB_POOL_MIN_SIZE: ${NOOP_DB_POOL_MIN_SIZE:-1}
  NOOP_DB_POOL_MAX_SIZE: ${NOOP_DB_POOL_MAX_SIZE:-8}
  NOOP_DB_STATEMENT_CACHE_SIZE: ${NOOP_DB_STATEMENT_CACHE_SIZE:-100}

x-noop-safety-environment: &noop-safety-environment
  NOOP_PUBLIC_BASE_URL: ${NOOP_PUBLIC_BASE_URL:-}
  NOOP_TWILIO_ACCOUNT_SID: ${NOOP_TWILIO_ACCOUNT_SID:-}
  NOOP_TWILIO_AUTH_TOKEN: ${NOOP_TWILIO_AUTH_TOKEN:-}
  NOOP_TWILIO_FROM_PHONE: ${NOOP_TWILIO_FROM_PHONE:-}
  NOOP_TWILIO_STATUS_CALLBACK_SECRET: ${NOOP_TWILIO_STATUS_CALLBACK_SECRET:-}
  NOOP_SAFETY_CAPABILITY_SECRET: ${NOOP_SAFETY_CAPABILITY_SECRET:-}
  NOOP_SAFETY_ACKNOWLEDGEMENT_TIMEOUT_SECONDS: ${NOOP_SAFETY_ACKNOWLEDGEMENT_TIMEOUT_SECONDS:-90}
  NOOP_SAFETY_INCIDENT_TTL_SECONDS: ${NOOP_SAFETY_INCIDENT_TTL_SECONDS:-43200}
  NOOP_SAFETY_ESCALATION_ROUNDS: ${NOOP_SAFETY_ESCALATION_ROUNDS:-4}
  NOOP_SAFETY_ESCALATION_INTERVAL_SECONDS: ${NOOP_SAFETY_ESCALATION_INTERVAL_SECONDS:-900}
  NOOP_SAFETY_AUTOMATIC_PAGING_ENABLED: ${NOOP_SAFETY_AUTOMATIC_PAGING_ENABLED:-false}
  NOOP_SAFETY_APPROVED_FALL_DETECTORS: ${NOOP_SAFETY_APPROVED_FALL_DETECTORS:-}
  NOOP_SAFETY_WORKER_POLL_SECONDS: ${NOOP_SAFETY_WORKER_POLL_SECONDS:-2}
  NOOP_SAFETY_WORKER_HEARTBEAT_TIMEOUT_SECONDS: ${NOOP_SAFETY_WORKER_HEARTBEAT_TIMEOUT_SECONDS:-30}
  NOOP_SAFETY_DELIVERY_LEASE_SECONDS: ${NOOP_SAFETY_DELIVERY_LEASE_SECONDS:-30}
  NOOP_SAFETY_RETRY_BASE_SECONDS: ${NOOP_SAFETY_RETRY_BASE_SECONDS:-5}
  NOOP_SAFETY_PROVIDER_REQUEST_TIMEOUT_SECONDS: ${NOOP_SAFETY_PROVIDER_REQUEST_TIMEOUT_SECONDS:-15}
  NOOP_SAFETY_PROVIDER_RECEIPT_TIMEOUT_SECONDS: ${NOOP_SAFETY_PROVIDER_RECEIPT_TIMEOUT_SECONDS:-300}
  NOOP_SAFETY_WORKER_BATCH_SIZE: ${NOOP_SAFETY_WORKER_BATCH_SIZE:-20}
  NOOP_SAFETY_WORKER_MAX_CONCURRENCY: ${NOOP_SAFETY_WORKER_MAX_CONCURRENCY:-6}
  NOOP_SAFETY_MAINTENANCE_BATCH_SIZE: ${NOOP_SAFETY_MAINTENANCE_BATCH_SIZE:-200}
  NOOP_SAFETY_PROVIDER_MAX_REQUESTS_PER_SECOND: ${NOOP_SAFETY_PROVIDER_MAX_REQUESTS_PER_SECOND:-5}
  NOOP_SAFETY_MONITORING_WINDOW_SECONDS: ${NOOP_SAFETY_MONITORING_WINDOW_SECONDS:-86400}
  NOOP_SAFETY_INCIDENT_RETENTION_DAYS: ${NOOP_SAFETY_INCIDENT_RETENTION_DAYS:-0}
  NOOP_SAFETY_CONTACT_RETENTION_DAYS: ${NOOP_SAFETY_CONTACT_RETENTION_DAYS:-0}
  NOOP_SAFETY_RETENTION_INTERVAL_HOURS: ${NOOP_SAFETY_RETENTION_INTERVAL_HOURS:-24}
  NOOP_SAFETY_RETENTION_MAX_BATCHES_PER_RUN: ${NOOP_SAFETY_RETENTION_MAX_BATCHES_PER_RUN:-20}

x-noop-api-environment: &noop-api-environment
  NOOP_API_TOKEN: ${NOOP_API_TOKEN:?set NOOP_API_TOKEN in .env}
  NOOP_AUTH_MODE: ${NOOP_AUTH_MODE:-single_owner}
  NOOP_MAX_REQUEST_BYTES: ${NOOP_MAX_REQUEST_BYTES:-10485760}
  NOOP_EXPORT_MAX_ROWS: ${NOOP_EXPORT_MAX_ROWS:-100000}
  NOOP_RETENTION_DAYS: ${NOOP_RETENTION_DAYS:-0}
  NOOP_RETENTION_INTERVAL_HOURS: ${NOOP_RETENTION_INTERVAL_HOURS:-24}
  NOOP_IDEMPOTENCY_REPLAY_GUARD_DAYS: ${NOOP_IDEMPOTENCY_REPLAY_GUARD_DAYS:-30}
  NOOP_RATE_LIMIT_REQUESTS_PER_MINUTE: ${NOOP_RATE_LIMIT_REQUESTS_PER_MINUTE:-120}
  NOOP_RATE_LIMIT_ORIGIN_REQUESTS_PER_MINUTE: ${NOOP_RATE_LIMIT_ORIGIN_REQUESTS_PER_MINUTE:-300}
  NOOP_RATE_LIMIT_PROVIDER_CALLBACK_PRE_AUTH_REQUESTS_PER_MINUTE: ${NOOP_RATE_LIMIT_PROVIDER_CALLBACK_PRE_AUTH_REQUESTS_PER_MINUTE:-12000}
  NOOP_RATE_LIMIT_PROVIDER_CALLBACK_REQUESTS_PER_MINUTE: ${NOOP_RATE_LIMIT_PROVIDER_CALLBACK_REQUESTS_PER_MINUTE:-6000}
  NOOP_RATE_LIMIT_MAX_KEYS: ${NOOP_RATE_LIMIT_MAX_KEYS:-10000}
  NOOP_FORWARDED_ALLOW_IPS: ${NOOP_FORWARDED_ALLOW_IPS:-127.0.0.1}
  NOOP_DASHBOARD_ENABLED: ${NOOP_DASHBOARD_ENABLED:-true}

services:
  db:
    image: timescale/timescaledb:2.20.3-pg16@sha256:559615191e7249779e5f83a74f01d309bce299bfadd6d3177d7a7b99610eef89
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NOOP_DB_NAME:-noop}
      POSTGRES_USER: noop
      POSTGRES_PASSWORD: ${NOOP_DB_PASSWORD:?set NOOP_DB_PASSWORD in .env}
    volumes:
      - noop_timescale_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *noop-database-environment
      NOOP_DATABASE_URL: ${NOOP_MIGRATION_DATABASE_URL:-postgresql://noop:${NOOP_DB_PASSWORD}@db:5432/${NOOP_DB_NAME:-noop}}
      NOOP_RUN_MIGRATIONS: "true"
    command: ["python", "-m", "app.migrate"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<:
        - *noop-database-environment
        - *noop-safety-environment
        - *noop-api-environment
      NOOP_DATABASE_URL: ${NOOP_API_DATABASE_URL:-postgresql://noop:${NOOP_DB_PASSWORD}@db:5432/${NOOP_DB_NAME:-noop}}
      NOOP_RUN_MIGRATIONS: "false"
      NOOP_SAFETY_WORKER_ENABLED: "false"
    # Loopback-only by default. See README.md before exposing this to a LAN or
    # the internet; public endpoints must sit behind TLS.
    ports:
      - "127.0.0.1:${NOOP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  safety-worker:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<:
        - *noop-database-environment
        - *noop-safety-environment
      NOOP_DATABASE_URL: ${NOOP_SAFETY_WORKER_DATABASE_URL:-postgresql://noop:${NOOP_DB_PASSWORD}@db:5432/${NOOP_DB_NAME:-noop}}
      NOOP_RUN_MIGRATIONS: "false"
    command: ["python", "-m", "app.safety_worker"]
    # Let an accepted provider request finish and persist its outcome on normal
    # deploys. This must remain longer than the configured provider timeout.
    stop_grace_period: ${NOOP_SAFETY_WORKER_STOP_GRACE_PERIOD:-45s}
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  backup:
    build:
      context: ./backup
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${NOOP_DB_NAME:-noop}
      PGUSER: ${NOOP_BACKUP_DB_USER:-noop}
      PGPASSWORD: ${NOOP_BACKUP_DB_PASSWORD:-${NOOP_DB_PASSWORD}}
      NOOP_BACKUP_DIRECTORY: /backups
      NOOP_BACKUP_INTERVAL_SECONDS: ${NOOP_BACKUP_INTERVAL_SECONDS:-86400}
      NOOP_BACKUP_RETENTION_DAYS: ${NOOP_BACKUP_RETENTION_DAYS:-30}
      NOOP_BACKUP_PASSPHRASE_FILE: /run/secrets/noop_backup_passphrase
    secrets:
      - noop_backup_passphrase
    volumes:
      - noop_encrypted_backups:/backups
    read_only: true
    tmpfs:
      - /tmp:size=${NOOP_BACKUP_TMPFS_SIZE:-2g},noexec,nosuid
      - /var/lib/postgresql:size=1m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "sh", "/opt/noop/backup-healthcheck.sh"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 5m

volumes:
  noop_timescale_data:
  noop_encrypted_backups:

secrets:
  noop_backup_passphrase:
    file: ${NOOP_BACKUP_SECRET_FILE:-./secrets/backup-passphrase.txt}
